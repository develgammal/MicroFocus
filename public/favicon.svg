<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#4f46e5"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <!-- Middle ring -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <!-- Inner circle (focus point) -->
  <circle cx="16" cy="16" r="5" fill="#ffffff"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#4f46e5"/>
</svg>
